# SDD Configuration — IPTVViewer
# Auto-generated by sdd-init phase on 2026-07-04.

project:
  name: IPTVViewer
  language: python
  framework: PyQt6
  type: desktop
  description: >
    Desktop IPTV viewer application consuming M3U playlists from a local xteve
    instance, with EPG XMLTV support, VLC/MPV media backends, and optional Tor
    proxy integration.

testing:
  runner: pytest
  version: "9.0.2"
  plugins:
    - pytest-qt (4.5.0)
  test_directory: tests/
  strict_tdd: true
  coverage:
    enabled: false

sdd:
  phase_rules:
    interactive: false
    review_budget_lines: 600
    artifact_store: both
    pr_strategy: auto-forecast

  skill_registry:
    path: .atl/skill-registry.md
    status: present

dependencies:
  source: requirements.txt
  notable:
    - PyQt6==6.8.1
    - python-vlc==3.0.21203
    - pytest==9.0.2
    - pytest-qt==4.5.0
    - torpy==1.1.6
    - cryptography>=3.0.0
    - requests
    - CacheControl
    - rich
    - sortedcontainers

paths:
  source: src/
  tests: tests/
  config: config.ini
  entrypoint: main.py
  docs: docs/
  logs: logs/
  cache: cache/
