name: Build and Release

# Dispara el pipeline al hacer push de un tag de versión (ej. v1.2.3)
# o manualmente desde la pestaña Actions -> "Run workflow".
#
# Nota: libmpv-2.dll ya NO se descarga en CI ni se empaqueta en el exe;
# la app la descarga en runtime (release 20260814 de shinchiro/mpv-winbuild-cmake).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Derive version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          export IPTVVIEWER_VERSION="${VERSION}"
          python -m PyInstaller --noconfirm --clean IPTVViewer.spec
          ls -la dist/

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION installer\IPTVViewer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo con codigo $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/IPTVViewer.exe \
            dist/IPTVViewer-Setup-*.exe
