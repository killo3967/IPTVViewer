name: Build and Release

# Se dispara con cada push a main: calcula la versión automáticamente, compila
# el exe, genera el instalador y publica la release. La versión sube sola según
# los commits desde el último tag:
#   feat* -> minor | fix*/chore*/etc -> patch | BREAKING CHANGE/feat! -> major
# Para saltarte una release, incluye "[skip ci]" en el mensaje del commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Derive next version
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST_VER="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_VER}"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"

          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:%s 2>/dev/null || git log --pretty=format:%s)

          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^feat(\(.*\))?!:"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qiE "^feat"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Nueva version: v${VERSION}"

      - name: Set app version in source
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          p = "src/infrastructure/ui/main_window.py"
          s = open(p, encoding="utf-8").read()
          new = 'APP_VERSION = "' + os.environ["VERSION"] + '"'
          s = re.sub(r'APP_VERSION = "[^"]*"', new, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("APP_VERSION ->", os.environ["VERSION"])
          PY

      - name: Generate release notes
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, re, collections

          def run(cmd):
              try:
                  return subprocess.check_output(cmd, stderr=subprocess.DEVNULL).decode(errors="replace").strip()
              except subprocess.CalledProcessError:
                  return ""

          last = run(["git", "describe", "--tags", "--abbrev=0"])
          commits = run(["git", "log", f"{last}..HEAD", "--pretty=format:%s"]) if last else run(["git", "log", "--pretty=format:%s"])

          groups = collections.OrderedDict([
              ("Novedades", []),
              ("Correcciones", []),
              ("Mantenimiento", []),
          ])
          for line in commits.splitlines():
              s = line.strip()
              if not s:
                  continue
              m = re.match(r"^(feat|fix|perf|chore|docs|ref|refactor|test|build|ci|style)(\([^)]*\))?!?:\s*(.*)$", s, re.I)
              t = m.group(1).lower() if m else ""
              subject = m.group(3) if m and m.group(3) else s
              subject = re.sub(r"\s*\[(?:skip ci|ci skip|no ci|skip actions)\]\s*", " ", subject, flags=re.I).strip()
              if t in ("feat", "perf"):
                  groups["Novedades"].append(subject)
              elif t == "fix":
                  groups["Correcciones"].append(subject)
              else:
                  groups["Mantenimiento"].append(subject)

          out = []
          for header, items in groups.items():
              if items:
                  out.append(f"## {header}")
                  out.extend(f"- {it}" for it in items)
                  out.append("")
          notes = "\n".join(out).strip()
          if not notes:
              notes = "Actualizacion de la aplicacion."
          open("release_notes.md", "w", encoding="utf-8").write(notes + "\n")
          print("release_notes.md generado")
          PY

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean IPTVViewer.spec
          ls -la dist/

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION installer\IPTVViewer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo con codigo $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            dist/IPTVViewer.exe \
            dist/IPTVViewer-Setup-*.exe
